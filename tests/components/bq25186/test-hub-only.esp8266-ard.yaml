packages:
  i2c: !include ../../test_build_components/common/i2c/esp8266-ard.yaml

bq25186:
  - id: bq25186_charger
    i2c_id: i2c_bus
    configure_on_boot: false
    fast_charge_current: 150mA
    battery_regulation_voltage: 4.2V
    input_current_limit: 500ma
    system_regulation: 4.5v
    charge_enabled: true
  - id: bq25186_boot
    i2c_id: i2c_bus
    address: 107
    configure_on_boot: true
    fast_charge_current: 20mA
    watchdog: 160s_software_reset
    update_interval: 30s
