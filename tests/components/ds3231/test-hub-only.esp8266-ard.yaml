packages:
  i2c: !include ../../test_build_components/common/i2c/esp8266-ard.yaml

ds3231:
  - id: ds3231_component
    i2c_id: i2c_bus
    address: 104
    square_wave_frequency: 1024Hz
    battery_backed_square_wave: false
    output_32khz: false
    aging_offset: -2
    auto_clear_alarms: true
    alarm_check_interval: 2s
