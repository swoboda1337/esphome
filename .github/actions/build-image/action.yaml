name: Build Image
inputs:
  target:
    description: "Target to build"
    required: true
    example: "docker"
  build_type:
    description: "Build type"
    required: true
    example: "docker"
  suffix:
    description: "Suffix to add to tags"
    required: true
  version:
    description: "Version to build"
    required: true
    example: "2023.12.0"
runs:
  using: "composite"
  steps:
    - name: Generate short tags
      id: tags
      shell: bash
      run: |
        output=$(docker/generate_tags.py \
          --tag "${{ inputs.version }}" \
          --suffix "${{ inputs.suffix }}")
        echo $output
        for l in $output; do
          echo $l >> $GITHUB_OUTPUT
        done

    # Layer cache lives in a per-arch registry tag next to the image
    # (like docker/build.py's cache-dev tag) instead of the Actions
    # cache, which counts against the repo's 10GB quota and gets
    # evicted. Only dev builds write it.
    - id: cache
      shell: bash
      run: |-
        ref="ghcr.io/${{ steps.tags.outputs.image_name }}:cache-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}"
        echo "from=type=registry,ref=${ref}" >> $GITHUB_OUTPUT
        if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
          echo "to=type=registry,ref=${ref},mode=max" >> $GITHUB_OUTPUT
        else
          echo "to=" >> $GITHUB_OUTPUT
        fi

    - name: Build and push to ghcr by digest
      id: build-ghcr
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      env:
        DOCKER_BUILD_SUMMARY: false
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        context: .
        file: ./docker/Dockerfile
        target: ${{ inputs.target }}
        cache-from: ${{ steps.cache.outputs.from }}
        cache-to: ${{ steps.cache.outputs.to }}
        build-args: |
          BUILD_TYPE=${{ inputs.build_type }}
          BUILD_VERSION=${{ inputs.version }}
        outputs: |
          type=image,name=ghcr.io/${{ steps.tags.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true

    - name: Export ghcr digests
      shell: bash
      run: |
        mkdir -p /tmp/digests/${{ inputs.build_type }}/ghcr
        digest="${{ steps.build-ghcr.outputs.digest }}"
        touch "/tmp/digests/${{ inputs.build_type }}/ghcr/${digest#sha256:}"

    - name: Build and push to dockerhub by digest
      id: build-dockerhub
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      env:
        DOCKER_BUILD_SUMMARY: false
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        context: .
        file: ./docker/Dockerfile
        target: ${{ inputs.target }}
        # No cache-to: the ghcr build above just populated the local
        # layer store, so a second cache export would be redundant.
        cache-from: ${{ steps.cache.outputs.from }}
        build-args: |
          BUILD_TYPE=${{ inputs.build_type }}
          BUILD_VERSION=${{ inputs.version }}
        outputs: |
          type=image,name=docker.io/${{ steps.tags.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true

    - name: Export dockerhub digests
      shell: bash
      run: |
        mkdir -p /tmp/digests/${{ inputs.build_type }}/dockerhub
        digest="${{ steps.build-dockerhub.outputs.digest }}"
        touch "/tmp/digests/${{ inputs.build_type }}/dockerhub/${digest#sha256:}"
